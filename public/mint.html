<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Membership Pass — Public Mint (Drop)</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--card:#0f172a;--accent:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:#000;color:#e5e7eb;font:16px system-ui,Segoe UI,Roboto}
.wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px}
h1{margin:6px 0 14px;font-size:28px}
.card{background:var(--card);border:1px solid #1e293b;border-radius:14px;padding:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:320px;background:#0b1220;border:1px solid #23304a;color:#d9e4fb;border-radius:10px;padding:12px}
.btn{background:var(--accent);color:#111;border:0;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.pill{padding:6px 10px;border-radius:999px;font-size:12px;background:#0b1220;border:1px solid #22324d;color:#b8c6dd}
.status{margin-top:10px}.ok{color:#22c55e}.err{color:#ef4444}
textarea{width:100%;height:200px;background:#0b1220;border:1px solid #23304a;color:#d9e4fb;border-radius:10px;padding:12px}
</style>
<script>
(function(){
  try{const a=new URL(location.href).searchParams.get('contract');
      if(a&&/^0x[a-fA-F0-9]{40}$/.test(a)) localStorage.setItem('dropAddress',a);}catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>Membership Pass — Public Mint (Drop)</h1>
  <div class="card" style="margin-bottom:12px">
    <div class="row" style="margin-bottom:8px">
      <input id="addr" placeholder="0x... Drop address"/>
      <button id="save" class="btn">Save Address</button>
      <button id="connect" class="btn">Connect Wallet</button>
      <button id="mint" class="btn">Mint 1</button>
    </div>
    <div class="row" style="gap:12px">
      <span id="net" class="pill">Network: —</span>
      <span id="me" class="pill">Wallet: —</span>
      <span class="pill">Mode: Drop (claim)</span>
    </div>
    <div id="st" class="status">Connect, then click Mint 1. If it fails: make sure the claim phase is active, eligibility reset, and unclaimed supply > 0.</div>
  </div>
  <div class="card"><textarea id="log" readonly></textarea></div>
</div>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const $=id=>document.getElementById(id);
  const log=m=>{ $('log').value+=(typeof m==='string'?m:JSON.stringify(m,null,2))+'\n'; $('log').scrollTop=$('log').scrollHeight; };
  const status=(t,c='')=>{const s=$('st'); s.textContent=t; s.className='status '+c;};
  const REQUIRED=11155111;
  $('addr').value=localStorage.getItem('dropAddress')||'0xFCd271B5AFc9e219B78bd221c6aC01CdB2bB47a2';
  $('save').onclick=()=>{const v=$('addr').value.trim(); if(/^0x[a-fA-F0-9]{40}$/.test(v)){localStorage.setItem('dropAddress',v); status('Saved ✓','ok');} else status('Enter a valid 0x address','err');};
  let provider,signer,me;
  async function connect(){
    if(!window.ethereum) throw new Error('MetaMask not detected');
    provider=new ethers.providers.Web3Provider(window.ethereum,'any');
    await provider.send('eth_requestAccounts',[]);
    let net=await provider.getNetwork(); $('net').textContent=`Network: #${net.chainId}`;
    if(net.chainId!==REQUIRED){
      status('Switching to Sepolia…','err');
      try{await provider.send('wallet_switchEthereumChain',[{chainId:'0xaa36a7'}]); net=await provider.getNetwork();}
      catch(e){throw new Error('Please switch to Sepolia');}
    }
    signer=provider.getSigner(); me=await signer.getAddress();
    $('me').textContent=`Wallet: ${me.slice(0,6)}…${me.slice(-4)}`;
    status('Connected. Ready.','ok');
  }
  // Minimal Drop ABI: claimTo + claim
  const ABI=[
    "function claimTo(address receiver,uint256 quantity) payable",
    "function claim(uint256 quantity) payable",
    "function totalClaimed() view returns (uint256)",
    "function totalUnclaimed() view returns (uint256)"
  ];
  function drop(){const a=$('addr').value.trim(); if(!/^0x[a-fA-F0-9]{40}$/.test(a)) throw new Error('Invalid contract address'); return new ethers.Contract(a,ABI,signer);}
  async function mint(){
    try{
      await connect();
      const c=drop();
      // quick visibility
      try{
        const uc=await c.totalUnclaimed(); const cl=await c.totalClaimed();
        log({unclaimed: uc.toString(), claimed: cl.toString()});
      }catch{}
      // try claimTo first
      status('Sending claimTo(me,1)…',''); log({to: $('addr').value, quantity:1, value:'0'});
      try{
        const tx=await c.claimTo(me,1,{value:0}); log('tx: '+tx.hash); const rc=await tx.wait();
        if(rc.status===1){ status('✅ Minted via claimTo', 'ok'); return; }
      }catch(e){ log('claimTo failed'); log(e); }
      // fallback claim
      status('Trying claim(1)…',''); 
      const tx2=await c.claim(1,{value:0}); log('tx: '+tx2.hash); const rc2=await tx2.wait();
      if(rc2.status===1){ status('✅ Minted via claim', 'ok'); }
      else status('Reverted','err');
    }catch(e){ status('Mint failed — see log','err'); log(e); }
  }
  $('connect').onclick=()=>connect().catch(e=>{status(e.message||String(e),'err'); log(e);});
  $('mint').onclick=()=>mint();
});
</script>
</body>
</html>
